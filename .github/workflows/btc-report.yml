name: BTC Monitor

on:
  schedule:
    # 每10分钟检查一次 (暴跌3%实时告警 + 每2h详细报告)
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制推送报告（忽略时间窗口）'
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run BTC monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_REPORT: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python btc_report.py

      - name: Persist state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add report_state.json
          git diff --cached --quiet || git commit -m "chore: update report state"
          git push
