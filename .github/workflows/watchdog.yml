name: Watchdog — BTC Monitor 存活检查

on:
  schedule:
    # 每小时检查一次 BTC Monitor 是否还活着
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 查最近一次 BTC Monitor run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 获取最近一次 BTC Monitor 的 run 时间和状态
          LAST_RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/btc-report.yml/runs?per_page=1" \
            --jq '.workflow_runs[0]')

          LAST_TIME=$(echo "$LAST_RUN" | jq -r '.created_at')
          STATUS=$(echo "$LAST_RUN" | jq -r '.status')
          CONCLUSION=$(echo "$LAST_RUN" | jq -r '.conclusion')

          # 转为 Unix 时间戳
          LAST_TS=$(date -d "$LAST_TIME" +%s)
          NOW_TS=$(date +%s)
          GAP=$(( (NOW_TS - LAST_TS) / 60 ))

          echo "状态: $STATUS / $CONCLUSION"
          echo "上次运行: $LAST_TIME ($GAP 分钟前)"

          if [ "$GAP" -gt 60 ]; then
            echo "⚠️ 超过 1 小时没跑，触发补推..."
            echo "trigger=true" >> $GITHUB_OUTPUT
          else
            echo "✅ 正常，跳过"
            echo "trigger=false" >> $GITHUB_OUTPUT
          fi

      - name: 补推
        if: steps.check.outputs.trigger == 'true'
        run: |
          gh workflow run btc-report.yml \
            --repo "${{ github.repository }}" \
            -f force=true
          echo "已触发补推"
