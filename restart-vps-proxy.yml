name: Restart VPS Proxy

on:
  workflow_dispatch:

jobs:
  restart-ss:
    runs-on: ubuntu-latest
    steps:
      - name: Restart Shadowsocks on VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_SSH_KEY_2 }}" > ~/.ssh/id_ed25519_vps
          chmod 600 ~/.ssh/id_ed25519_vps
          echo "StrictHostKeyChecking accept-new" >> ~/.ssh/config
          for IP in 43.132.141.61 150.109.247.58; do
            echo === Trying $IP ===
            for KEY in ~/.ssh/id_ed25519 ~/.ssh/id_ed25519_vps; do
              echo "--- Key: $KEY ---"
              ssh -o ConnectTimeout=10 -i "$KEY" ubuntu@$IP 'echo SSH_OK; sudo systemctl restart shadowsocks-libev 2>&1 || sudo systemctl restart shadowsocks 2>&1; echo ===STATUS===; sudo systemctl status shadowsocks-libev --no-pager 2>&1 || sudo systemctl status shadowsocks --no-pager 2>&1; echo ===PORT===; ss -tlnp | grep 3456; echo ===LOGS===; sudo journalctl -u shadowsocks-libev -n 20 --no-pager 2>&1 || sudo journalctl -u shadowsocks -n 20 --no-pager 2>&1' 2>&1 && break
            done
          done
